<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>larpwallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 420px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .header .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #3a3a3c, #1c1c1e);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; border: 1px solid #2c2c2e;
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .balance-card {
            background: #141414;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #242426;
            margin-bottom: 20px;
        }
        .balance-card .label { color: #8e8e93; font-size: 13px; text-transform: uppercase; }
        .balance-card .total { font-size: 36px; font-weight: 700; margin-top: 4px; }
        .balance-card .usdt { color: #636366; font-size: 14px; margin-top: 4px; }
        .assets-title { color: #8e8e93; font-size: 13px; margin-bottom: 12px; text-transform: uppercase; }
        .asset-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #1c1c1e;
        }
        .asset-item .left { display: flex; align-items: center; gap: 10px; }
        .asset-item .icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700;
            background: #1c1c1e; border: 1px solid #2a2a2c;
        }
        .asset-item .name { font-weight: 600; }
        .asset-item .symbol { color: #636366; font-size: 12px; }
        .asset-item .address {
            font-family: monospace; font-size: 10px; color: #636366;
            word-break: break-all; max-width: 140px;
        }
        .asset-item .right { text-align: right; }
        .asset-item .balance { font-weight: 600; }
        .asset-item .value { color: #8e8e93; font-size: 12px; }
        .btn {
            background: #2c2c2e; border: none; color: white;
            padding: 14px; border-radius: 14px; width: 100%;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 12px; transition: background 0.2s;
        }
        .btn:hover { background: #3a3a3c; }
        .loading { color: #636366; text-align: center; padding: 40px 0; }
        .error { color: #ff3b30; text-align: center; padding: 40px 0; }
        .user-id { 
            color: #636366; 
            font-size: 12px; 
            text-align: center; 
            margin-top: 16px;
            padding: 8px;
            background: #141414;
            border-radius: 8px;
            border: 1px solid #242426;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⛓</div>
            <h1>larpwallet</h1>
        </div>

        <div class="balance-card">
            <div class="label">Total Balance</div>
            <div class="total" id="total">Loading...</div>
            <div class="usdt" id="usdt">≈ 0.00 USDT</div>
        </div>

        <div class="assets-title">Assets</div>
        <div id="assetsList">
            <div class="loading">Loading assets...</div>
        </div>

        <button class="btn" onclick="loadData()">🔄 Refresh</button>
        
        <div class="user-id" id="userIdDisplay">👤 User ID: loading...</div>
    </div>

    <script>
        // ===== АВТОМАТИЧЕСКИ ПОЛУЧАЕМ USER_ID ИЗ TELEGRAM =====
        let USER_ID = null;
        
        // Пытаемся получить ID из Telegram WebApp
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                USER_ID = tg.initDataUnsafe?.user?.id || null;
                console.log('✅ ID получен из Telegram:', USER_ID);
            }
        } catch (e) {
            console.log('⚠️ Не удалось получить ID из Telegram:', e);
        }

        // Если не получилось через Telegram - используем тестовый ID
        if (!USER_ID) {
            // Для тестирования вне Telegram (например, в браузере)
            // ⚠️ Если сайт открыт в браузере, используем захардкоженный ID
            USER_ID = 123456789;  // ЗАМЕНИ НА СВОЙ ID ДЛЯ ТЕСТОВ В БРАУЗЕРЕ
            console.log('⚠️ Использую тестовый ID:', USER_ID);
            document.getElementById('userIdDisplay').textContent = '⚠️ Тестовый режим (вне Telegram)';
        } else {
            document.getElementById('userIdDisplay').textContent = `👤 User ID: ${USER_ID}`;
        }

        // ===== ЗАГРУЗКА ДАННЫХ =====
        async function loadData() {
            try {
                const response = await fetch(`/api/balance/${USER_ID}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                document.getElementById('total').textContent = `$${data.total_usd.toFixed(2)} USD`;
                document.getElementById('usdt').textContent = `≈ ${data.total_usd.toFixed(2)} USDT`;
                
                let html = '';
                if (data.assets && data.assets.length > 0) {
                    data.assets.forEach(a => {
                        const value = (a.balance * a.price).toFixed(2);
                        html += `
                            <div class="asset-item">
                                <div class="left">
                                    <div class="icon">${a.icon}</div>
                                    <div>
                                        <div class="name">${a.name}</div>
                                        <div class="symbol">${a.symbol}</div>
                                        <div class="address">${a.address}</div>
                                    </div>
                                </div>
                                <div class="right">
                                    <div class="balance">${a.balance} ${a.symbol}</div>
                                    <div class="value">$${value}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html = '<div class="loading">No assets found. Please start the bot first.</div>';
                }
                document.getElementById('assetsList').innerHTML = html;
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('assetsList').innerHTML = `
                    <div class="error">
                        ❌ Error loading data<br>
                        <small style="color:#636366;">${error.message}</small>
                    </div>
                `;
            }
        }

        // Загружаем данные при открытии страницы
        loadData();
        
        // Обновляем каждые 30 секунд
        setInterval(loadData, 30000);
    </script>
</body>
</html>
